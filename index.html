
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6414B8">

<title>Zepto | Selfie Verification</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 0%, #a65bf0 0%, transparent 38%),
    linear-gradient(145deg, #31066b, #6414b8 55%, #8d32dc);
  color: #35105f;
  display: flex;
  justify-content: center;
  align-items: center;
  padding:
    max(8px, env(safe-area-inset-top))
    max(12px, env(safe-area-inset-right))
    max(8px, env(safe-area-inset-bottom))
    max(12px, env(safe-area-inset-left));
}

.page {
  width: 100%;
  max-width: 440px;
  height: 100%;
  max-height: 850px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  gap: 9px;
}

/* BRAND */

.brand {
  color: white;
  text-align: center;
  flex-shrink: 0;
}

.brand-name {
  font-size: clamp(25px, 6vw, 33px);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
}

.brand-name span {
  color: #ffcf45;
}

.brand-subtitle {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: .85;
  margin-top: 4px;
}

/* MAIN PANEL */

.panel {
  flex: 1;
  min-height: 0;
  background: #fff;
  border-radius: 23px;
  padding: clamp(12px, 3vh, 21px);
  box-shadow: 0 18px 55px rgba(20, 0, 45, .35);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADING */

.heading {
  text-align: center;
  flex-shrink: 0;
  margin-bottom: 12px;
}

.heading h2 {
  font-size: clamp(18px, 5vw, 22px);
  font-weight: 800;
  color: #35105f;
}

.heading p {
  font-size: 11px;
  color: #888;
  margin-top: 5px;
  line-height: 1.4;
}

/* CAMERA LABEL */

.camera-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  margin-bottom: 8px;
  font-size: 10px;
  font-weight: 800;
  color: #5a287f;
}

.live-status {
  display: flex;
  align-items: center;
  gap: 5px;
  color: #159653;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #19b56a;
  box-shadow: 0 0 0 3px #19b56a22;
}

/* CAMERA FRAME */

.camera-frame {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 100px;
  overflow: hidden;
  border-radius: 17px;
  background: #190d25;
  border: 3px solid #eee4fa;
}

video,
#preview {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

#preview {
  display: none;
}

/* CAMERA HINT */

.camera-hint {
  flex-shrink: 0;
  text-align: center;
  font-size: 10px;
  color: #999;
  margin-top: 7px;
}

/* BUTTONS */

.actions {
  display: flex;
  gap: 9px;
  flex-shrink: 0;
  margin-top: 11px;
}

button {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  border: none;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: transform .15s, opacity .15s;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  transform: scale(.97);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#captureBtn {
  background: linear-gradient(135deg, #6414b8, #8d35df);
  color: white;
  box-shadow: 0 5px 13px #6414b833;
}

#retakeBtn {
  display: none;
  background: #f1e7fb;
  color: #59129a;
}

#continueBtn {
  background: linear-gradient(135deg, #159653, #20b96b);
  color: white;
  box-shadow: 0 5px 13px #15965330;
}

#cancelBtn {
  background: #f3f3f5;
  color: #666;
}

/* STATUS */

#status {
  min-height: 28px;
  flex-shrink: 0;
  margin-top: 9px;
  text-align: center;
  font-size: 11px;
  color: #777;
  line-height: 1.4;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* FOOTER */

.footer {
  flex-shrink: 0;
  text-align: center;
  color: rgba(255,255,255,.75);
  font-size: 9px;
  letter-spacing: .6px;
}

/* SHORT SCREEN */

@media (max-height: 650px) {
  .page {
    gap: 5px;
  }

  .panel {
    padding: 10px 13px;
    border-radius: 18px;
  }

  .heading {
    margin-bottom: 7px;
  }

  .heading h2 {
    font-size: 18px;
  }

  .heading p {
    font-size: 10px;
    margin-top: 3px;
  }

  .camera-label {
    margin-bottom: 5px;
  }

  .camera-hint {
    margin-top: 5px;
    font-size: 9px;
  }

  .actions {
    margin-top: 7px;
  }

  button {
    min-height: 38px;
    font-size: 11px;
  }

  #status {
    min-height: 22px;
    margin-top: 5px;
    font-size: 10px;
  }

  .footer {
    font-size: 8px;
  }
}

/* VERY NARROW MOBILE */

@media (max-width: 350px) {
  .panel {
    padding: 11px 10px;
  }

  button {
    font-size: 10px;
    min-height: 41px;
  }

  .heading p {
    font-size: 10px;
  }
}

/* LANDSCAPE MOBILE */

@media (max-height: 480px) and (orientation: landscape) {
  .page {
    max-width: 700px;
    flex-direction: row;
    align-items: stretch;
    gap: 10px;
  }

  .brand {
    width: 115px;
    align-self: center;
  }

  .brand-name {
    font-size: 26px;
  }

  .brand-subtitle {
    font-size: 7px;
  }

  .panel {
    flex: 1;
  }

  .heading {
    margin-bottom: 5px;
  }

  .heading h2 {
    font-size: 17px;
  }

  .camera-hint,
  .footer {
    display: none;
  }

  .camera-frame {
    min-height: 60px;
  }

  .actions {
    margin-top: 5px;
  }

  button {
    min-height: 34px;
  }
}
</style>
</head>

<body>

<main class="page">

  <header class="brand">
    <div class="brand-name">zepto<span>.</span></div>
    <div class="brand-subtitle">MH Attendance Portal</div>
  </header>

  <section class="panel">

    <div class="heading">
      <h2>Selfie Verification</h2>
      <p>Please capture your live selfie to continue your attendance.</p>
    </div>

    <div class="camera-label">
      <span>CAMERA PREVIEW</span>

      <span class="live-status">
        <span class="live-dot"></span>
        LIVE CAMERA
      </span>
    </div>

    <div class="camera-frame">
      <video id="video" autoplay playsinline muted></video>
      <img id="preview" alt="Captured selfie">
    </div>

    <p class="camera-hint">
      Keep your face clearly visible inside the camera frame.
    </p>

    <canvas id="canvas" hidden></canvas>

    <div class="actions">
      <button id="captureBtn">Capture Selfie</button>
      <button id="retakeBtn">Retake</button>
    </div>

    <div class="actions">
      <button id="cancelBtn">Cancel</button>
      <button id="continueBtn" disabled>Continue</button>
    </div>

    <div id="status">
      Requesting camera access...
    </div>

  </section>

  <footer class="footer">
    ZEPTO MH ATTENDANCE • SECURE SELFIE VERIFICATION
  </footer>

</main>

<script>

const video = document.getElementById("video");
const preview = document.getElementById("preview");
const canvas = document.getElementById("canvas");

const captureBtn = document.getElementById("captureBtn");
const retakeBtn = document.getElementById("retakeBtn");
const continueBtn = document.getElementById("continueBtn");
const cancelBtn = document.getElementById("cancelBtn");
const statusText = document.getElementById("status");

let cameraStream = null;
let capturedImage = null;
let requestFinished = false;

// Get attendance request token
const params = new URLSearchParams(window.location.search);
const requestToken = params.get("token");

// Stop all active camera tracks
function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => {
      track.stop();
    });

    cameraStream = null;
  }

  video.srcObject = null;
}

// Notify attendance portal about cancellation
function notifyCancellation(reason) {

  if (requestFinished) return;

  requestFinished = true;

  stopCamera();

  if (window.opener && !window.opener.closed && requestToken) {
    window.opener.postMessage(
      {
        type: "ATTENDANCE_SELFIE_CANCELLED",
        token: requestToken,
        reason: reason
      },
      "*"
    );
  }

  // Disable all camera actions
  captureBtn.disabled = true;
  retakeBtn.disabled = true;
  continueBtn.disabled = true;
  cancelBtn.disabled = true;

  statusText.textContent = reason;

  // Close camera popup
  setTimeout(function() {
    window.close();
  }, 800);
}

// Start camera
async function startCamera() {

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error("CAMERA_NOT_SUPPORTED");
    }

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    if (requestFinished) {
      stopCamera();
      return;
    }

    video.srcObject = cameraStream;

    await video.play();

    statusText.textContent =
      "Camera ready. Capture your selfie.";

  } catch (error) {

    console.error("Camera Error:", error);

    let reason = "Camera unavailable. Please check browser settings.";

    if (
      error.name === "NotAllowedError" ||
      error.name === "PermissionDeniedError"
    ) {
      reason = "Camera permission denied. Please allow camera access and try again.";

    } else if (
      error.name === "NotFoundError" ||
      error.name === "DevicesNotFoundError"
    ) {
      reason = "No camera was found on this device.";

    } else if (
      error.name === "NotReadableError" ||
      error.name === "TrackStartError"
    ) {
      reason = "Camera is being used by another application.";

    } else if (error.message === "CAMERA_NOT_SUPPORTED") {
      reason = "Camera is not supported in this browser.";

    } else if (error.name === "AbortError") {
      reason = "Camera could not be started. Please try again.";
    }

    notifyCancellation(reason);
  }
}

// Capture selfie
captureBtn.onclick = function() {

  if (requestFinished || !video.videoWidth) return;

  const maxWidth = 1280;
  const scale = Math.min(1, maxWidth / video.videoWidth);

  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);

  canvas.getContext("2d").drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  capturedImage = canvas.toDataURL("image/jpeg", 0.85);

  preview.src = capturedImage;
  preview.style.display = "block";
  video.style.display = "none";

  captureBtn.style.display = "none";
  retakeBtn.style.display = "block";

  continueBtn.disabled = false;

  statusText.textContent =
    "Selfie captured successfully.";
};

// Retake selfie
retakeBtn.onclick = function() {

  if (requestFinished) return;

  capturedImage = null;

  preview.src = "";
  preview.style.display = "none";

  video.style.display = "block";

  captureBtn.style.display = "block";
  retakeBtn.style.display = "none";

  continueBtn.disabled = true;

  statusText.textContent =
    "Capture your selfie again.";
};

// Continue and send selfie
continueBtn.onclick = function() {

  if (requestFinished || !capturedImage) return;

  if (!window.opener || window.opener.closed) {

    notifyCancellation(
      "Attendance portal connection not found. Please restart."
    );

    return;
  }

  if (!requestToken) {

    notifyCancellation(
      "Invalid attendance request. Please restart."
    );

    return;
  }

  continueBtn.disabled = true;
  cancelBtn.disabled = true;

  statusText.textContent =
    "Sending selfie to attendance portal...";

  window.opener.postMessage(
    {
      type: "ATTENDANCE_SELFIE_CAPTURED",
      token: requestToken,
      image: capturedImage
    },
    "*"
  );

  requestFinished = true;

  stopCamera();

  statusText.textContent =
    "Selfie sent successfully.";

  setTimeout(function() {
    window.close();
  }, 500);
};

// Cancel button
cancelBtn.onclick = function() {

  notifyCancellation(
    "Selfie cancelled. Returning to attendance portal..."
  );

};

// Start camera
startCamera();

</script>

</body>
</html>
